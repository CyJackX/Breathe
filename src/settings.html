<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BreatheWidget Settings</title>
    <link rel="stylesheet" href="settings.css" />
    <script type="module" src="/settings.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>BreatheWidget Settings</h1>

      <section class="panel">
        <label class="field">
          <span class="label">Seconds per phase</span>
          <input id="speed" type="range" min="1" max="10" step="0.5" value="4" />
          <span class="value" id="speedValue">4.0s</span>
        </label>

        <label class="field">
          <span class="label">Min size</span>
          <input id="minScale" type="range" min="0" max="0.99" step="0.01" value="0.35" />
          <span class="value" id="minScaleValue">35%</span>
        </label>

        <label class="field">
          <span class="label">Opacity</span>
          <input id="widgetOpacity" type="range" min="0.1" max="1" step="0.05" value="1" />
          <span class="value" id="widgetOpacityValue">100%</span>
        </label>

        <label class="field">
          <span class="label">Accent color (only when no image)</span>
          <input id="accentColor" type="color" value="#7dd3fc" />
        </label>

        <div class="field">
          <span class="label">Breathing object image/SVG</span>
          <div class="row">
            <button id="pickImage" type="button">Choose…</button>
            <button id="clearImage" type="button">Clear</button>
            <input id="fileInput" type="file" accept="image/*,.svg" style="display: none" />
          </div>
          <p class="hint" id="imageHint">No image selected.</p>
        </div>
      </section>
    </main>
  </body>
</html>
