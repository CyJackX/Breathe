<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathe Widget</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body data-tauri-drag-region>
    <main class="app" id="app" data-tauri-drag-region>
      <button
        class="gear-button"
        id="gearButton"
        data-tauri-drag-region="false"
        aria-label="Settings"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm9.2 3.1-.9-.3a7.4 7.4 0 0 0-.7-1.7l.5-.8a.8.8 0 0 0-.1-1l-1.5-1.5a.8.8 0 0 0-1-.1l-.8.5c-.5-.3-1.1-.5-1.7-.7l-.3-.9a.8.8 0 0 0-.8-.6h-2.1a.8.8 0 0 0-.8.6l-.3.9c-.6.2-1.2.4-1.7.7l-.8-.5a.8.8 0 0 0-1 .1L4.9 7.9a.8.8 0 0 0-.1 1l.5.8c-.3.5-.5 1.1-.7 1.7l-.9.3a.8.8 0 0 0-.6.8v2.1c0 .4.3.7.6.8l.9.3c.2.6.4 1.2.7 1.7l-.5.8a.8.8 0 0 0 .1 1l1.5 1.5c.3.3.7.3 1 .1l.8-.5c.5.3 1.1.5 1.7.7l.3.9c.1.3.4.6.8.6h2.1c.4 0 .7-.3.8-.6l.3-.9c.6-.2 1.2-.4 1.7-.7l.8.5c.3.2.7.2 1-.1l1.5-1.5c.3-.3.3-.7.1-1l-.5-.8c.3-.5.5-1.1.7-1.7l.9-.3c.3-.1.6-.4.6-.8v-2.1c0-.4-.3-.7-.6-.8z"
          />
        </svg>
      </button>
      <div class="object" id="object" data-tauri-drag-region>
        <img id="objectImage" alt="" />
      </div>
      <div class="label" id="label" data-tauri-drag-region>Inhale</div>
      <div
        class="controls"
        id="controls"
        data-tauri-drag-region="false"
        aria-hidden="true"
      >
        <label class="control">
          Seconds per phase
          <input id="speed" type="range" min="2" max="8" step="0.5" value="4" />
          <span id="speedValue">4.0s</span>
        </label>
        <label class="control">
          Accent color
          <input id="color" type="color" value="#7dd3fc" />
        </label>
        <div class="control">
          <span>Breathing object</span>
          <div class="button-row">
            <button id="pickImage" type="button">Choose image</button>
            <button id="clearImage" type="button">Clear</button>
          </div>
          <input
            id="fileInput"
            type="file"
            accept="image/*,.svg"
            style="display: none"
          />
        </div>
        <label class="control inline">
          <input id="showText" type="checkbox" checked />
          Show text
        </label>
      </div>
    </main>
  </body>
</html>
