<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathe Widget</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app" id="app">
      <div class="top-right-controls" data-tauri-drag-region="false">
      <button
        class="gear-button"
        id="gearButton"
        data-tauri-drag-region="false"
        aria-label="Settings"
        type="button"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          viewBox="0 0 50 50"
        >
          <path
            fill="currentColor"
            d="M25 34c-5 0-9-4-9-9s4-9 9-9s9 4 9 9s-4 9-9 9m0-16c-3.9 0-7 3.1-7 7s3.1 7 7 7s7-3.1 7-7s-3.1-7-7-7"
          />
          <path
            fill="currentColor"
            d="M27.7 44h-5.4l-1.5-4.6c-1-.3-2-.7-2.9-1.2l-4.4 2.2l-3.8-3.8l2.2-4.4c-.5-.9-.9-1.9-1.2-2.9L6 27.7v-5.4l4.6-1.5c.3-1 .7-2 1.2-2.9l-2.2-4.4l3.8-3.8l4.4 2.2c.9-.5 1.9-.9 2.9-1.2L22.3 6h5.4l1.5 4.6c1 .3 2 .7 2.9 1.2l4.4-2.2l3.8 3.8l-2.2 4.4c.5.9.9 1.9 1.2 2.9l4.6 1.5v5.4l-4.6 1.5c-.3 1-.7 2-1.2 2.9l2.2 4.4l-3.8 3.8l-4.4-2.2c-.9.5-1.9.9-2.9 1.2zm-4-2h2.6l1.4-4.3l.5-.1c1.2-.3 2.3-.8 3.4-1.4l.5-.3l4 2l1.8-1.8l-2-4l.3-.5c.6-1 1.1-2.2 1.4-3.4l.1-.5l4.3-1.4v-2.6l-4.3-1.4l-.1-.5c-.3-1.2-.8-2.3-1.4-3.4l-.3-.5l2-4l-1.8-1.8l-4 2l-.5-.3c-1.1-.6-2.2-1.1-3.4-1.4l-.5-.1L26.3 8h-2.6l-1.4 4.3l-.5.1c-1.2.3-2.3.8-3.4 1.4l-.5.3l-4-2l-1.8 1.8l2 4l-.3.5c-.6 1-1.1 2.2-1.4 3.4l-.1.5L8 23.7v2.6l4.3 1.4l.1.5c.3 1.2.8 2.3 1.4 3.4l.3.5l-2 4l1.8 1.8l4-2l.5.3c1.1.6 2.2 1.1 3.4 1.4l.5.1z"
          />
        </svg>
      </button>
      <button
        class="exit-button"
        id="exitButton"
        data-tauri-drag-region="false"
        aria-label="Exit"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 1 0 5.7 7.11L10.59 12l-4.9 4.89a1 1 0 1 0 1.42 1.42L12 13.41l4.89 4.9a1 1 0 0 0 1.42-1.42L13.41 12l4.9-4.89a1 1 0 0 0-.01-1.4Z"
          />
        </svg>
      </button>
      </div>
      <!-- Frameless resize handles (visual + interactive on hover). -->
      <div class="resize-handle resize-handle--n" data-resize="North" aria-hidden="true"></div>
      <div class="resize-handle resize-handle--s" data-resize="South" aria-hidden="true"></div>
      <div class="resize-handle resize-handle--e" data-resize="East" aria-hidden="true"></div>
      <div class="resize-handle resize-handle--w" data-resize="West" aria-hidden="true"></div>
      <div
        class="resize-handle resize-handle--ne"
        data-resize="NorthEast"
        aria-hidden="true"
      ></div>
      <div
        class="resize-handle resize-handle--nw"
        data-resize="NorthWest"
        aria-hidden="true"
      ></div>
      <div
        class="resize-handle resize-handle--se"
        data-resize="SouthEast"
        aria-hidden="true"
      ></div>
      <div
        class="resize-handle resize-handle--sw"
        data-resize="SouthWest"
        aria-hidden="true"
      ></div>
      <div class="object" id="object">
        <img id="objectImage" alt="" />
      </div>
    </main>
  </body>
</html>
